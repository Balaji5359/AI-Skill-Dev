version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
environment:
  variables:
    VITE_CONTACT_API_URL: https://nrkg7cmta3.execute-api.ap-south-1.amazonaws.com/dev/skillroute_landingpagecontactsection_api
redirects:
  # SPA fallback so React Router routes (/profiledata, /interview/test, etc.) resolve to index.html
  - source: "/<*>"
    target: "/index.html"
    status: "200"
